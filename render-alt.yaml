# Alternative render.yaml without rootDir
# Use this if the main render.yaml has path issues
services:
  - type: web
    name: healthcare-docs-backend
    runtime: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && gunicorn --bind 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
    plan: free
    healthCheckPath: /api/health

